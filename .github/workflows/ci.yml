name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev

      - name: Build GTest from source
        run: |
          cd /usr/src/gtest
          sudo cmake CMakeLists.txt
          sudo make
          sudo cp lib/libgtest*.a /usr/lib/

      - name: Configure and build
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Upload MyCppFormat binary
        uses: actions/upload-artifact@v4
        with:
          name: mycppformat-binary
          path: build/src/MyCppFormat

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-binaries
          path: build/tests/unit/

  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: build/tests/unit

      - name: Make test binary executable
        run: chmod +x build/tests/unit/unit

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -R "unit.*"

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Download MyCppFormat binary
        uses: actions/download-artifact@v4
        with:
          name: mycppformat-binary
          path: build/src

      - name: Make binary executable
        run: chmod +x build/src/MyCppFormat

      - name: Run integration tests
        run: |
          cd tests/integration
          chmod +x run_tests.sh
          ./run_tests.sh ../../build/src/MyCppFormat
